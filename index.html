<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2447">
<title>Bunny's Bedroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235b9fe5'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141a33; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* cheap colour grade: soft vignette + warm tint, no post-processing pass */
  #grade { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(255,214,150,.05) 0%, rgba(0,0,0,0) 45%, rgba(18,10,36,.38) 100%); mix-blend-mode: normal; }
  #mute { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom));
    width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(255,244,214,.78); color: #5b4a2c; display: grid; place-items: center; touch-action: manipulation; }
  #mute svg { width: 24px; height: 24px; }
  #mute .off { display: none; }
  #mute.muted .on { display: none; } #mute.muted .off { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>

<canvas id="view" tabindex="-1"></canvas>
<div id="grade"></div>
<button id="mute" aria-label="Sound on/off" title="Sound">
  <svg class="on" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm12.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
